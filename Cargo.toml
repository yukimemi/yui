[package]
name = "yui-cli"
version = "0.10.0"
edition = "2024"
rust-version = "1.85"
description = "Target-as-truth dotfiles manager: edit your live configs, source repo updates automatically via hardlink/junction/symlink."
authors = ["yukimemi"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/yukimemi/yui"
homepage = "https://github.com/yukimemi/yui"
keywords = ["dotfiles", "config", "symlink", "hardlink", "junction"]
categories = ["command-line-utilities", "config"]
include = [
    "src/**/*.rs",
    "assets/icon.svg",
    "assets/logo.svg",
    "assets/logo-dark.svg",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[[bin]]
name = "yui"
path = "src/main.rs"

[lib]
name = "yui"
path = "src/lib.rs"

[dependencies]
age = { version = "0.11.3", features = ["cli-common", "plugin"] }
anyhow = "1.0.104"
base64 = "0.23.0"
camino = { version = "1.2.5", features = ["serde1"] }
clap = { version = "4.6.4", features = ["derive", "env"] }
clap_complete = "4.6.8"
# OS cache dir resolution for the transient auto-update state file
# (`<cache>/yui/last_update_check.json`). Matches renri.
dirs = "6"
globset = "0.4.19"
ignore = "0.4.31"
indicatif = "0.18.6"
jiff = { version = "0.2.35", features = ["serde"] }
# Shared self-update library (`yui self-update` + background
# auto-update). Pinned to match rvpm / renri; kaishin's surface is
# still 0.x. 0.5.0 adds `Checker::auto_update` (silent background
# install).
kaishin = "0.6.4"
owo-colors = "4.3.0"
same-file = "1.0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = "3.1.1"
teravars = { version = "0.2.1", default-features = false }
thiserror = "2.0.19"
# Runtime needed by kaishin's async API. `run_self_update` drives it
# from a blocking `current_thread` runtime so that path stays sync; the
# background auto-update instead spawns a task on a small
# `new_multi_thread` runtime in `main` so the fetch / install overlaps
# the command, then drains it at shutdown with a bounded
# `tokio::time::timeout` (mirrors renri / rvpm). `macros` is still
# unused — `updater` doesn't use `#[tokio::main]` / `tokio::test`.
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "time"] }
toml = "1.1.3"
toml_edit = "0.25.13"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
whoami = "2"

[target.'cfg(windows)'.dependencies]
junction = "2.0.0"

[dev-dependencies]
assert_cmd = "2.2.2"
assert_fs = "1.1.4"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
