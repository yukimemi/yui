name: Install smoke

on:
  pull_request:
    paths:
      - install.sh
      - install.ps1
      - .github/workflows/install.yml
  push:
    branches: [main]
    paths:
      - install.sh
      - install.ps1
      - .github/workflows/install.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install and reinstall (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/yui home"
          mkdir -p "$HOME"
          cat install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          yui --version
          cat install.sh | sh
          yui --version
      - name: Install and reinstall (Windows)
        if: runner.os == 'Windows'
        # Exercise the Windows PowerShell 5.1 baseline, not just PowerShell 7.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'yui home'
          $environmentKey = [Microsoft.Win32.Registry]::CurrentUser.CreateSubKey('Environment')
          $originalPath = $environmentKey.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          $seededPath = "$originalPath;" + '%USERPROFILE%\yui-path-regression'
          $environmentKey.SetValue('Path', $seededPath, [Microsoft.Win32.RegistryValueKind]::ExpandString)
          Get-Content -Raw install.ps1 | Invoke-Expression
          yui --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed yui could not run.' }
          Get-Content -Raw install.ps1 | Invoke-Expression
          yui --version
          if ($LASTEXITCODE -ne 0) { throw 'Reinstalled yui could not run.' }
          $bin = Join-Path $env:LOCALAPPDATA 'yui\bin'
          $entries = ([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') |
            Where-Object { $_ -eq $bin }
          if (@($entries).Count -ne 1) { throw 'Installer duplicated or omitted the user PATH entry.' }
          $rawPath = $environmentKey.GetValue('Path', '', [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
          if ($rawPath -cne "$seededPath;$bin") { throw 'Installer changed existing user PATH entries.' }
          if ($environmentKey.GetValueKind('Path') -ne [Microsoft.Win32.RegistryValueKind]::ExpandString) {
            throw 'Installer changed the user PATH registry type.'
          }
          $environmentKey.Dispose()
